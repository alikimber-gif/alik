<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#5B8A72"/>
  <g transform="translate(256,240)">
    <!-- Butterfly wings (Hashimoto's awareness symbol / thyroid shape) -->
    <ellipse cx="-70" cy="-20" rx="85" ry="60" fill="#fff" opacity="0.9" transform="rotate(-15)"/>
    <ellipse cx="70" cy="-20" rx="85" ry="60" fill="#fff" opacity="0.9" transform="rotate(15)"/>
    <ellipse cx="-55" cy="40" rx="55" ry="40" fill="#fff" opacity="0.7" transform="rotate(-10)"/>
    <ellipse cx="55" cy="40" rx="55" ry="40" fill="#fff" opacity="0.7" transform="rotate(10)"/>
    <!-- Body -->
    <rect x="-4" y="-60" width="8" height="120" rx="4" fill="#fff" opacity="0.95"/>
    <!-- Antennae -->
    <line x1="0" y1="-60" x2="-20" y2="-85" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="0" y1="-60" x2="20" y2="-85" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-20" cy="-85" r="5" fill="#fff" opacity="0.8"/>
    <circle cx="20" cy="-85" r="5" fill="#fff" opacity="0.8"/>
  </g>
  <!-- Plus/health cross -->
  <rect x="230" y="380" width="52" height="16" rx="8" fill="#fff" opacity="0.5"/>
  <rect x="248" y="362" width="16" height="52" rx="8" fill="#fff" opacity="0.5"/>
</svg>
